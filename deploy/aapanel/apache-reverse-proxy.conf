# Apache Reverse Proxy configuration for aaPanel
# Site: wa-api.billi-panca-wijaya.my.id
# Target: http://127.0.0.1:18091

<VirtualHost *:80>
    ServerName wa-api.billi-panca-wijaya.my.id
    ServerAlias wa-api.billi-panca-wijaya.my.id

    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass / http://127.0.0.1:18091/
    ProxyPassReverse / http://127.0.0.1:18091/

    # WebSocket support for Baileys QR code streams
    RewriteEngine on
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://127.0.0.1:18091/$1" [P,L]

    ErrorLog /www/wwwlogs/wa-api.billi-panca-wijaya.my.id_error.log
    CustomLog /www/wwwlogs/wa-api.billi-panca-wijaya.my.id_access.log combined
</VirtualHost>
